name: ci

on:
  push:
    branches: [main]
  schedule:
    # Reconcile: uploads to the asset CDN the builds an app published since (apps hold no
    # Cloudflare token) and redeploys the site only when it is behind. A no-op otherwise.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      reconcile:
        description: Redeploy the site if an app published a newer build (no build, no tests)
        type: boolean
        default: false
      staging-ref:
        description: Deploy this branch, tag or SHA to staging (leave empty to deploy main to production)
        type: string
        default: ''

concurrency:
  # A manual staging deploy from main must not cancel main's production deploy.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.staging-ref }}
  # Never cancel a production deploy halfway (a newer push to main waits for it); a superseded
  # staging deploy may be dropped.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.staging-ref != '' }}

permissions:
  contents: read

jobs:
  pwa:
    uses: huishouden/pwa-kit/.github/workflows/pwa.yml@v0.107.0
    permissions:
      contents: write # the hosting release asset, the version's tag and release
      id-token: write
    with:
      base: /
      staging-ref: ${{ inputs.staging-ref }}
      reconcile: ${{ github.event_name == 'schedule' || inputs.reconcile == true }}
    # The asset CDN's upload (pwa-kit docs/one-site.md "Asset CDN"); only these two secrets.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
