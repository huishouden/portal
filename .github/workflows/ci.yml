name: ci

on:
  push:
    branches: [main]
  # The nightly run sweeps staging of test households and users that cancelled runs left behind,
  # after its daily quota resets (07:00 UTC in PDT, 08:00 in PST).
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      staging-ref:
        description: Deploy this branch, tag or SHA to staging (leave empty to deploy main to production)
        type: string
        default: ''

concurrency:
  # A manual staging deploy from main must not cancel main's production deploy, nor the nightly
  # sweep a push's deploy (github.event.schedule is empty for every other event).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.staging-ref }}-${{ github.event.schedule }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pwa:
    uses: huishouden/pwa-kit/.github/workflows/pwa.yml@v0
    permissions:
      contents: write # README screenshots, PR evidence branch, the hosting release asset
      id-token: write
      pull-requests: write # before/after comment on PRs
    with:
      base: /
      site-url: https://huishouden-piekstra.web.app/
      staging-ref: ${{ inputs.staging-ref }}
      staging-sweep: ${{ github.event_name == 'schedule' }}

  release:
    uses: huishouden/pwa-kit/.github/workflows/release.yml@v0
    permissions:
      contents: write
      pull-requests: write
